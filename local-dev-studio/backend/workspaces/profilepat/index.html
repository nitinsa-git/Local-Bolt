<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Studio App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .bg-slate-950 { background-color: #020617; }
    .bg-slate-900\/95 { background-color: rgba(15, 23, 42, 0.95); }
    .bg-slate-800 { background-color: #1e293b; }
    .bg-indigo-600 { background-color: #4f46e5; }
    .bg-indigo-500\/20 { background-color: rgba(99, 102, 241, 0.2); }
    .bg-emerald-600\/20 { background-color: rgba(5, 150, 105, 0.2); }
    .text-slate-100 { color: #f1f5f9; }
    .text-slate-400 { color: #94a3b8; }
    .text-indigo-300 { color: #a5b4fc; }
    .text-indigo-400 { color: #818cf8; }
    .text-emerald-300 { color: #6ee7b7; }
    .text-white { color: #ffffff; }
    .border { border-width: 1px; border-style: solid; }
    .border-slate-800 { border-color: #1e293b; }
    .border-indigo-500\/30 { border-color: rgba(99, 102, 241, 0.3); }
    .border-emerald-500\/30 { border-color: rgba(16, 185, 129, 0.3); }
    .min-h-screen { min-height: 100vh; }
    .flex { display: flex; }
    .grid { display: grid; }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .flex-1 { flex: 1 1 0%; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .p-1\.5 { padding: 0.375rem; }
    .p-6 { padding: 1.5rem; }
    .p-8 { padding: 2rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3\.5 { padding-top: 0.875rem; padding-bottom: 0.875rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .my-8 { margin-top: 2rem; margin-bottom: 2rem; }
    .max-w-md { max-width: 28rem; }
    .w-full { width: 100%; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-full { border-radius: 9999px; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-7xl { font-size: 4.5rem; line-height: 1; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .font-black { font-weight: 900; }
    .font-sans { font-family: ui-sans-serif, system-ui, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .tracking-tight { letter-spacing: -0.025em; }
    .tracking-tighter { letter-spacing: -0.05em; }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .select-none { user-select: none; }
    button { cursor: pointer; border: none; background: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">
  <div class="max-w-md w-full bg-slate-900/95 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="flex items-center justify-between mb-4">
      <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
        NEXTJS LIVE SANDBOX
      </span>
      <span id="session-badge" class="text-xs text-slate-400">Sessions: 0</span>
    </div>
    <h1 class="text-2xl font-bold tracking-tight mb-1">Autonomous Studio App</h1>
    <p class="text-xs text-slate-400 mb-6">Create a responsive one pager profle for a developer with 15 years of experience in UI/ UX and for now polulate it with sample data to verify the app</p>

    <div class="grid grid-cols-3 gap-2 mb-6 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
      <button onclick="setMode('focus', 1500)" id="btn-focus" class="py-2 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">Focus 25m</button>
      <button onclick="setMode('short', 300)" id="btn-short" class="py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Short 5m</button>
      <button onclick="setMode('long', 900)" id="btn-long" class="py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Long 15m</button>
    </div>

    <div class="relative flex items-center justify-center my-8">
      <div id="timer-display" class="text-7xl font-mono font-black tracking-tighter text-indigo-400 select-none">
        25:00
      </div>
    </div>

    <div class="flex gap-3">
      <button id="toggle-btn" onclick="toggleTimer()" class="flex-1 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] font-semibold text-sm shadow-lg shadow-indigo-600/30 transition">
        Start Timer
      </button>
      <button onclick="resetTimer()" class="px-4 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold transition">
        Reset
      </button>
      <button onclick="playAlert()" class="px-4 py-3.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-semibold transition" title="Test WebAudio Chime">
        Audio Bell
      </button>
    </div>
  </div>

  <script>
    let duration = 1500;
    let remaining = 1500;
    let running = false;
    let intervalId = null;
    let sessions = 0;

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      document.getElementById('timer-display').textContent = formatTime(remaining);
    }

    function playAlert() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.22, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.45);
        });
        console.log('[PomodoroAudio] Played WebAudio harmonic chime');
      } catch (err) {
        console.warn('AudioContext blocked or unsupported:', err);
      }
    }

    function setMode(mode, secs) {
      running = false;
      clearInterval(intervalId);
      duration = secs;
      remaining = secs;
      document.getElementById('toggle-btn').textContent = 'Start Timer';
      ['focus', 'short', 'long'].forEach(m => {
        const el = document.getElementById('btn-' + m);
        el.className = m === mode
          ? 'py-2 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition'
          : 'py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
      });
      updateDisplay();
    }

    function toggleTimer() {
      running = !running;
      document.getElementById('toggle-btn').textContent = running ? 'Pause' : 'Resume';
      if (running) {
        intervalId = setInterval(() => {
          if (remaining <= 1) {
            clearInterval(intervalId);
            running = false;
            sessions += 1;
            document.getElementById('session-badge').textContent = 'Sessions: ' + sessions;
            document.getElementById('toggle-btn').textContent = 'Start Timer';
            remaining = duration;
            updateDisplay();
            playAlert();
          } else {
            remaining -= 1;
            updateDisplay();
          }
        }, 1000);
      } else {
        clearInterval(intervalId);
      }
    }

    function resetTimer() {
      running = false;
      clearInterval(intervalId);
      remaining = duration;
      document.getElementById('toggle-btn').textContent = 'Start Timer';
      updateDisplay();
    }
  </script>
</body>
</html>
